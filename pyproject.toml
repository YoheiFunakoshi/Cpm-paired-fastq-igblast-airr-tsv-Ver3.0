[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cpm-paired-fastq-igblast-airr-tsv-v3"
version = "3.0.1"
description = "Annotate retained CPM paired-end FASTQ reads once with RG-compatible IgBLAST integration, then count exact raw UMIs within each V/J/canonical junction-AA clonotype."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cpm-paired-fastq-igblast-airr-tsv-v3 = "airr_igblast_paired.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
